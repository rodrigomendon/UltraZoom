name: Build UltraZoom APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ultrazoom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare isolated Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ultrazoom-project"
          mkdir -p "$RUNNER_TEMP/ultrazoom-project"
          archive=""
          if [ -f "UltraZoom-00-v12.3.0-ZOOM-GEOMETRY-ENGINE-BUILD-FIX.zip" ]; then
            archive="UltraZoom-00-v12.3.0-ZOOM-GEOMETRY-ENGINE-BUILD-FIX.zip"
          elif [ -f "UltraZoom-build-fixed.zip" ]; then
            archive="UltraZoom-build-fixed.zip"
          fi
          if [ -z "$archive" ]; then
            echo "ERROR: expected UltraZoom 12.3 archive was not found in repository root."
            find . -maxdepth 1 -type f -name 'UltraZoom*.zip' -print
            exit 1
          fi
          echo "Using archive: $archive"
          unzip -q -o "$archive" -d "$RUNNER_TEMP/ultrazoom-project"
          if [ -d "$RUNNER_TEMP/ultrazoom-project/UltraZoom" ] && [ -f "$RUNNER_TEMP/ultrazoom-project/UltraZoom/settings.gradle" ]; then
            project="$RUNNER_TEMP/ultrazoom-project/UltraZoom"
          else
            project="$RUNNER_TEMP/ultrazoom-project"
          fi
          test -f "$project/settings.gradle"
          test -f "$project/build.gradle"
          test -f "$project/app/build.gradle"
          test -f "$project/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo "Project prepared at $project"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraZoom-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

